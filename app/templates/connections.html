{% extends "base.html" %}
{% set active_page = "connections" %}
{% block content %}

<div class="page-header">
    <h1>服务器连接</h1>
    <div>
        <button class="btn btn-primary" onclick="openForm()">添加连接</button>
    </div>
</div>

<div class="card">
    <div class="table-wrap">
        <table class="table">
            <caption class="sr-only">服务器连接列表</caption>
            <thead>
                <tr>
                    <th scope="col">名称</th>
                    <th scope="col">地址</th>
                    <th scope="col">协议</th>
                    <th scope="col">状态</th>
                    <th scope="col">默认</th>
                    <th scope="col">操作</th>
                </tr>
            </thead>
            <tbody id="connTableBody">
            </tbody>
        </table>
    </div>
    <div id="connEmpty" class="empty-state" role="status" style="display:none">
        <div class="icon" aria-hidden="true">🌐</div>暂无连接，点击右上角「添加连接」创建。
    </div>
</div>

<!-- 添加 / 编辑 表单弹窗 -->
<div class="modal-overlay" id="connModal" role="presentation">
    <div class="modal modal-md" role="dialog" aria-modal="true" aria-labelledby="connModalTitle">
        <h2 id="connModalTitle">添加连接</h2>
        <input type="hidden" id="connId">
        <div class="form-group">
            <label for="connName">名称<span style="color:var(--danger,#e5484d);margin-left:2px" aria-hidden="true">*</span></label>
            <input type="text" id="connName" class="form-control" placeholder="例如：本地服务器" inputmode="text" enterkeyhint="next" name="conn-name" autocomplete="off" required aria-required="true">
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="connHost">地址 (host)<span style="color:var(--danger,#e5484d);margin-left:2px" aria-hidden="true">*</span></label>
                <input type="text" id="connHost" class="form-control" placeholder="例如：127.0.0.1" inputmode="text" enterkeyhint="next" name="conn-host" autocomplete="off" required aria-required="true">
            </div>
            <div class="form-group form-group--narrow">
                <label for="connPort">端口 (port)<span style="color:var(--danger,#e5484d);margin-left:2px" aria-hidden="true">*</span></label>
                <input type="number" id="connPort" class="form-control" placeholder="8080" min="1" max="65535" inputmode="numeric" enterkeyhint="next" name="conn-port" autocomplete="off" required aria-required="true">
            </div>
        </div>
        <div class="form-group">
            <label for="connProtocol">协议<span style="color:var(--danger,#e5484d);margin-left:2px" aria-hidden="true">*</span></label>
            <select id="connProtocol" class="form-control" required aria-required="true">
                <option value="tcp">tcp</option>
                <option value="ws">ws</option>
            </select>
        </div>
        <div class="form-group">
            <label for="connToken">Token（可选）</label>
            <div class="input-with-toggle">
                <input type="password" id="connToken" class="form-control" placeholder="可选" inputmode="text" enterkeyhint="next" autocomplete="off" style="padding-right:48px">
                <button type="button" class="pw-toggle" aria-pressed="false" aria-label="显示 Token" onclick="togglePwVisibility('connToken', this)">显示</button>
            </div>
        </div>
        <div class="form-group">
            <label for="connNote">备注（可选）</label>
            <textarea id="connNote" class="form-control" rows="2" placeholder="可选"></textarea>
        </div>
        <div class="form-group" style="margin-top:4px">
            <button type="button" class="btn btn-outline btn-sm" onclick="testConnection(event)">测试连接</button>
        </div>
        <div class="modal-actions">
            <button class="btn btn-outline" onclick="closeForm()">取消</button>
            <button class="btn btn-primary" onclick="submitForm()">保存</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/connections.js"></script>
{% endblock %}
