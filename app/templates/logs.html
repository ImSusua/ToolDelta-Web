{% extends "base.html" %}
{% set active_page = "logs" %}
{% block content %}
<div class="page-header">
    <h1>日志</h1>
    <div>
        <button class="btn btn-sm btn-outline" id="logLineNumBtn" onclick="toggleLogLineNumbers()" aria-pressed="false" title="显示/隐藏行号（点击行号可复制该行）"><span aria-hidden="true">#</span> 行号</button>
        <button class="btn btn-primary" onclick="loadLogs()">搜索</button>
        <button class="btn btn-outline" onclick="refreshLogs()">刷新</button>
        <button class="btn btn-outline" onclick="doExport()">导出</button>
        <button class="btn btn-outline" onclick="confirmClear()">清屏</button>
    </div>
</div>

<div class="search-bar logs-search-bar">
    <select id="logLevel" aria-label="按级别筛选">
        <option value="">全部级别</option>
        <option value="INFO">INFO</option>
        <option value="WARN">WARN</option>
        <option value="ERROR">ERROR</option>
        <option value="DEBUG">DEBUG</option>
    </select>
    <select id="logSource" aria-label="按来源筛选"><option value="">全部来源</option></select>
    <input type="text" id="logFilter" placeholder="关键字过滤..." oninput="debounceFilter()" inputmode="search" aria-label="关键字过滤">
    <select id="logDate" onchange="loadLogs()" aria-label="选择日期">
        <option value="today">今天</option>
    </select>
</div>

<div class="console-wrap">
    <div class="console-header">
        <span id="logStatus">日志</span>
        <span id="logCount">0 行</span>
    </div>
    <div class="console-body log-body" id="logBody" style="height:600px" role="log" aria-live="off" aria-label="日志输出"></div>
</div>
<style>
/* 移动端日志高度：覆盖内联 600px（内联 style 优先级最高，需 !important） */
@media (max-width: 768px) {
    .log-body { height: 55vh !important; max-height: 65vh; font-size: 11px; }
}
@media (max-width: 400px) {
    .log-body { height: 45vh !important; }
}
/* 日志搜索栏移动端堆叠（同时支持 .search-bar 与 .logs-search-bar 选择器，兼容旧调用） */
@media (max-width: 768px) {
    .logs-search-bar, .search-bar { flex-direction: column; }
}

/* ─── 日志行号样式 ─── */
.log-body {
    padding-left: 14px;
}
.log-body.show-log-lines {
    padding-left: 52px;
}
.log-body .log-line {
    position: relative;
}
.log-body .log-line .log-ln {
    display: none;
    position: absolute;
    left: -38px;
    width: 32px;
    text-align: right;
    color: var(--ink-tertiary);
    font-size: 11px;
    opacity: 0.55;
    user-select: none;
    font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace;
    cursor: pointer;
    transition: opacity .15s, color .15s;
}
.log-body.show-log-lines .log-line .log-ln {
    display: inline-block;
}
.log-body .log-line .log-ln:hover {
    opacity: 1;
    color: var(--primary-hover);
}
@media (max-width: 400px) {
    .log-body.show-log-lines { padding-left: 42px; }
    .log-body.show-log-lines .log-line .log-ln { left: -30px; width: 24px; }
}
/* 搜索高亮在 console.html 中已统一定义 .log-body mark */
</style>
{% endblock %}

{% block scripts %}
<script src="/static/js/logs.js"></script>
<script>
  // 视图状态持久化：刷新后保留筛选条件（参考 Linear 表格筛选记忆）
  if (window.tdPref) {
    ['logLevel','logSource','logFilter','logDate'].forEach(function(id){
      var el = document.getElementById(id);
      if (el) tdPref.bind('logs', el, id);
    });
  }
</script>
{% endblock %}
