{% extends "base.html" %}
{% set active_page = "backup" %}
{% block content %}
<style>
/* 备份项移动端堆叠：窄屏下名称与操作按钮纵向排列，操作区占满宽度 */
@media (max-width: 600px) {
    .backup-item { flex-direction: column; align-items: flex-start; gap: 8px; }
    .backup-actions { width: 100%; }
    .backup-actions .btn { flex: 1; }
}
</style>
<div class="page-header">
    <h1>备份与恢复</h1>
    <div>
        <button class="btn btn-primary" id="btnCreate" onclick="createBackup()">创建备份</button>
        <button class="btn btn-danger" onclick="showFactoryReset()">恢复出厂设置</button>
    </div>
</div>

<div class="card">
    <h2>说明</h2>
    <p class="notice">备份将保存 插件文件、插件配置文件、插件数据文件和 ToolDelta 基本配置。恢复出厂设置将清空所有插件、配置和数据。</p>
</div>

<div id="backupList"></div>
{% endblock %}

{% block scripts %}
<script>
function _esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(m){
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
    });
}

// 友好的文件大小格式化（覆盖 B/KB/MB/GB，避免一律按 KB 显示）
function fmtSize(b){
    b = Number(b) || 0;
    if(b < 1024) return b + ' B';
    if(b < 1048576) return (b/1024).toFixed(1) + ' KB';
    if(b < 1073741824) return (b/1048576).toFixed(2) + ' MB';
    return (b/1073741824).toFixed(2) + ' GB';
}

function loadBackups() {
    var container = document.getElementById('backupList');
    // 加载态：骨架屏（renderState 缺失时回退到空 innerHTML 等待）
    if (container && window.renderState) renderState(container, 'skeleton', {count: 3});
    fetch('/api/backups')
        .then(function(r) { return r.json(); })
        .then(function(backups) {
            if (!container) return;
            if (!backups || backups.length === 0) {
                if (window.renderState) {
                    renderState(container, 'empty', {
                        icon: '💾', title: '暂无备份',
                        hint: '点击「创建备份」生成第一份',
                        cta: '创建备份', ctaFn: createBackup
                    });
                } else {
                    container.innerHTML = '<div class="empty-state"><div class="icon" aria-hidden="true">💾</div>暂无备份，点击「创建备份」生成第一份。</div>';
                }
                return;
            }
            // 名称、zip 均转义；onclick 用 JSON.stringify + _esc 双重保险，防止引号闭合
            // 按时间倒序排列：最新的备份在最前面（后端已排序，前端兜底再次排序）
            var sortedBackups = backups.slice().sort(function(a, b) {
                var ta = String(a.time || '');
                var tb = String(b.time || '');
                return tb.localeCompare(ta);
            });
            container.innerHTML = sortedBackups.map(function(b) {
                var zipAttr = _esc(JSON.stringify(b.zip));
                var nameAttr = _esc(b.name);
                return '<div class="backup-item">' +
                    '<div><strong>' + nameAttr + '</strong>' +
                    '<div class="backup-meta">' + _esc(b.time) + ' | ' + fmtSize(b.size) + '</div></div>' +
                    '<div class="backup-actions">' +
                    '<button class="btn btn-sm btn-primary" aria-label="还原备份 ' + nameAttr + '" onclick="restoreBackup(' + zipAttr + ', this, ' + _esc(JSON.stringify(b.name)) + ')">还原</button>' +
                    '<button class="btn btn-sm btn-danger" aria-label="删除备份 ' + nameAttr + '" onclick="deleteBackup(' + zipAttr + ', this, ' + _esc(JSON.stringify(b.name)) + ')">删除</button></div></div>';
            }).join('');
        })
        .catch(function() {
            // 失败不再静默：列表区显示错误态 + 重试按钮
            if (container && window.renderState) {
                renderState(container, 'error', { message: '加载备份失败', retry: loadBackups });
            } else {
                container.innerHTML = '<div class="empty-state empty-state-error" role="alert"><div class="icon">⚠</div><div class="empty-title">加载备份失败</div><button class="btn btn-outline btn-sm" onclick="loadBackups()">重试</button></div>';
            }
        });
}

function createBackup() {
    // 默认名 backup_YYYY-MM-DD_HHMM，用户可清空后自定义
    var def = 'backup_' + new Date().toISOString().slice(0,16).replace('T','_').replace(':','');
    showPrompt('备份名称（可选）：', '例如：daily-backup', def, function(name) {
        if (name === null) return; // 用户取消
        if (name && /[\\/:*?"<>|]/.test(name)) {
            showToast('名称包含非法字符 / \\ : * ? " < > |', 'error'); return;
        }
        var btn = document.getElementById('btnCreate');
        if (btn) { btn.disabled = true; btn.textContent = '备份中...'; }
        fetch('/api/backup/create', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name: name || undefined}) })
            .then(function(r) { return r.json(); })
            .then(function(d) {
                if (d && d.success) { showToast('备份创建成功: ' + ((d.data && d.data.name) || d.name || ''), 'success'); loadBackups(); }
                else { showToast('备份创建失败: ' + (d.error || '未知错误'), 'error'); }
            })
            .catch(function() { showToast('备份创建失败', 'error'); })
            .finally(function() { if (btn) { btn.disabled = false; btn.textContent = '创建备份'; } });
    });
}

function restoreBackup(zip, btn, backupName) {
    var name = backupName || '此备份';
    showConfirm('确定还原备份「' + name + '」？当前数据将被覆盖。建议先创建备份。', function(ok) {
        if (!ok) return;
        // 操作中禁用按钮 + 进度提示，防止重复点击触发多次还原
        var origText = btn ? btn.textContent : '';
        if (btn) { btn.disabled = true; btn.textContent = '还原中...'; }
        fetch('/api/backup/restore', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({zip: zip}) })
            .then(function(r) { return r.json(); })
            .then(function(d) {
                showToast(d && d.success ? '还原成功' : '还原失败: ' + (d.message || d.error || ''), d && d.success ? 'success' : 'error');
                if (d && d.success) loadBackups(); // 还原成功后刷新列表
            })
            .catch(function() { showToast('还原请求失败', 'error'); })
            .finally(function() { if (btn) { btn.disabled = false; btn.textContent = origText; } });
    }, true);
}

function deleteBackup(zip, btn, backupName) {
    var name = backupName || '此备份';
    showConfirm('确定删除备份「' + name + '」？此操作不可撤销。', function(ok) {
        if (!ok) return;
        var origText = btn ? btn.textContent : '';
        if (btn) { btn.disabled = true; }
        fetch('/api/backup/delete', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({zip: zip}) })
            .then(function(r) { return r.json(); })
            .then(function(d) {
                if (d && d.success) { showToast('已删除备份「' + name + '」', 'info'); loadBackups(); }
                else { showToast('删除失败: ' + (d.error || ''), 'error'); }
            })
            .catch(function() { showToast('删除请求失败', 'error'); })
            .finally(function() { if (btn) { btn.disabled = false; btn.textContent = origText; } });
    }, true);
}

function showFactoryReset() {
    // 两次确认均标红（danger=true），强化风险提示
    showConfirm('确定恢复出厂设置？这将清空所有插件、配置和数据！建议先创建备份。', function(ok) {
        if (!ok) return;
        showConfirm('再次确认：此操作不可撤销！', function(ok2) {
            if (!ok2) return;
            fetch('/api/reset', { method:'POST' })
                .then(function(r) { return r.json(); })
                .then(function(d) {
                    if (d && d.success) { showToast('已恢复出厂设置', 'success'); loadBackups(); }
                    else { showToast('恢复出厂设置失败: ' + (d.error || ''), 'error'); }
                })
                .catch(function() { showToast('恢复出厂设置失败', 'error'); });
        }, true);
    }, true);
}

loadBackups();
</script>
{% endblock %}
