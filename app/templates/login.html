<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" id="themeColor" content="#0f1011">
    <title>登录 - ToolDelta Web</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script>
      /* ── 主题初始化：与 base.html / setup.html 统一使用 td_theme_v2 键 + data-theme 属性 ──
         pre-paint 在 CSS 渲染前执行，避免深色→浅色闪烁。 */
      (function () {
        var KEY = 'td_theme_v2';
        var mode = 'dark';
        try { mode = localStorage.getItem(KEY) || 'dark'; } catch (e) {}
        // 兼容旧键 td_theme 迁移
        if (mode === 'dark') {
          try { var old = localStorage.getItem('td_theme'); if (old === 'light') { mode = 'light'; localStorage.setItem(KEY, 'light'); } } catch (e) {}
        }
        if (mode !== 'dark' && mode !== 'light' && mode !== 'system') mode = 'dark';
        window._tdThemeMode = mode;
        function applyTheme(m) {
          var actual = m;
          if (m === 'system') actual = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', actual);
          document.documentElement.style.setProperty('color-scheme', actual);
          var mc = document.querySelector('meta[name="theme-color"]');
          if (mc) mc.setAttribute('content', actual === 'light' ? '#eef1f6' : '#0f1011');
        }
        window._tdApplyTheme = applyTheme;
        applyTheme(mode);
        if (window.matchMedia) {
          window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', function () {
            try { if ((localStorage.getItem(KEY) || 'dark') === 'system') applyTheme('system'); } catch (e) {}
          });
        }
      })();
    </script>
    <style>
        .auth-page {
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; min-height: 100dvh; background: var(--canvas);
            position: relative; padding: 20px;
        }
        .auth-card {
            position: relative; z-index: 1;
            /* fallback for backdrop-filter unsupported：浅色主题下用 surface-1（白） */
            background: var(--surface-1);
            border: 1px solid var(--hairline);
            border-radius: 20px; padding: 44px 40px; width: 100%; max-width: 390px;
            box-shadow: var(--shadow-lg, 0 24px 70px rgba(0,0,0,0.50));
            animation: authPop 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.1);
        }
        @supports (backdrop-filter: blur(24px)) {
            .auth-card {
                background: var(--glass-bg);
                backdrop-filter: blur(24px) saturate(160%);
                -webkit-backdrop-filter: blur(24px) saturate(160%);
            }
        }
        @keyframes authPop { from { transform: translateY(16px) scale(0.96); opacity: 0; } to { transform: none; opacity: 1; } }
        @media (prefers-reduced-motion: reduce) {
            .auth-card, .auth-card .logo-big { animation: none !important; }
        }
        .auth-card .logo-big {
            display: block; width: 60px; height: 60px; margin: 0 auto 18px;
            background: var(--grad-primary, linear-gradient(135deg, #5e6ad2, #828fff 55%, #a78bfa));
            border-radius: 16px; line-height: 60px; text-align: center;
            font-size: 26px; font-weight: 700; color: #fff;
            box-shadow: 0 8px 26px rgba(94, 106, 210, 0.45);
            animation: logoFloat 3s ease-in-out infinite;
        }
        @keyframes logoFloat { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-4px); } }
        .auth-card h1 { font-size: 23px; font-weight: 600; margin-bottom: 4px; text-align: center; letter-spacing: -0.4px; }
        .auth-card p.sub { font-size: 13px; color: var(--ink-muted); text-align: center; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--ink); }
        .form-group .input-wrap { position: relative; }
        .form-group .input-ico { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 15px; opacity: 0.5; pointer-events: none; }
        .form-group input { width: 100%; padding: 11px 12px 11px 38px; border-radius: 10px; border: 1px solid var(--hairline); background: var(--surface-1); color: var(--ink); font-size: 14px; outline: none; box-sizing: border-box; transition: border-color .18s, box-shadow .18s; }
        .form-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(94, 106, 210, 0.25); }
        @media (max-width: 768px) {
            .form-group input { font-size: 16px; }
            .auth-card { padding: 32px 24px; max-width: 100%; }
        }
        .auth-card .btn { width: 100%; padding: 12px; font-size: 15px; margin-top: 6px; }
        .auth-card .pw-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 13px; opacity: 0.6; user-select: none; transition: opacity .15s; background: transparent; border: 0; padding: 4px 6px; color: inherit; }
        .auth-card .pw-toggle:hover { opacity: 1; }
        .auth-card .pw-toggle:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; border-radius: 4px; opacity: 1; }
    </style>
</head>
<body class="auth-page">
    <a href="#loginForm" class="skip-link">跳到登录表单</a>
    <script src="/static/js/wallpaper.js"></script>
    {% if wallpaper_url %}<div id="loginWallpaper" class="wallpaper-bg auth-bg" aria-hidden="true"></div>
    <script>
      // 通过 |tojson 安全输出 URL，再由 JS 设置 backgroundImage，避免内联 style 拼接造成的 CSS 注入
      (function(){
        var el = document.getElementById('loginWallpaper');
        if (el) el.style.backgroundImage = "url(" + {{ wallpaper_url|tojson }} + ")";
      })();
    </script>
    {% endif %}
    <div class="auth-card">
        <span class="logo-big">TD</span>
        <h1>登录</h1>
        <p class="sub">ToolDelta Web 管理面板</p>
        <form id="loginForm" novalidate>
            <div class="form-group">
                <label for="username">用户名</label>
                <div class="input-wrap">
                    <span class="input-ico" aria-hidden="true">👤</span>
                    <input type="text" id="username" name="username" placeholder="输入用户名" autocomplete="username" enterkeyhint="next" autofocus>
                </div>
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <div class="input-wrap">
                    <span class="input-ico" aria-hidden="true">🔒</span>
                    <input type="password" id="password" name="password" placeholder="输入密码" autocomplete="current-password" enterkeyhint="go">
                    <button type="button" class="pw-toggle" aria-pressed="false" aria-label="显示密码" onclick="toggleLoginPw(this)">显示</button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary" id="loginBtn">
                <span class="btn-spinner" hidden></span><span>登录</span>
            </button>
            <div id="loginError" class="field-error" role="alert" aria-live="assertive" style="min-height:18px;margin-top:10px;text-align:center"></div>
        </form>
    </div>
    <div class="toast-container" id="toastContainer"></div>
    <script>
        function showToast(msg, type) {
            type = type || 'info';
            var container = document.getElementById('toastContainer');
            var t = document.createElement('div');
            t.className = 'toast ' + type;
            t.textContent = msg;
            container.appendChild(t);
            setTimeout(function() { t.remove(); }, 3000);
        }
        function toggleLoginPw(btn) {
            var i = document.getElementById('password');
            var isPw = i.type === 'password';
            i.type = isPw ? 'text' : 'password';
            btn.setAttribute('aria-pressed', isPw ? 'true' : 'false');
            btn.textContent = isPw ? '隐藏' : '显示';
            btn.setAttribute('aria-label', isPw ? '隐藏密码' : '显示密码');
        }
        function setLoginErr(msg) {
            var errEl = document.getElementById('loginError');
            if (errEl) errEl.textContent = msg || '';
        }
        function doLogin() {
            var u = document.getElementById('username').value.trim();
            var p = document.getElementById('password').value;
            if (!u || !p) {
                setLoginErr('请输入用户名和密码');
                if (!u) document.getElementById('username').focus();
                else {
                    var pw0 = document.getElementById('password');
                    pw0.setAttribute('aria-invalid', 'true');
                    pw0.focus();
                }
                return;
            }
            setLoginErr('');
            document.getElementById('password').removeAttribute('aria-invalid');
            var btn = document.getElementById('loginBtn');
            var spinner = btn.querySelector('.btn-spinner');
            btn.disabled = true;
            if (spinner) spinner.hidden = false;
            fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:u, password:p}) })
            .then(function(r){return r.json()})
            .then(function(d){
                if (d.success) {
                    setLoginErr('');
                    showToast('登录成功', 'success');
                    setTimeout(function(){ window.location.href='/'; }, 100);
                } else {
                    btn.disabled = false;
                    if (spinner) spinner.hidden = true;
                    setLoginErr(d.error || '用户名或密码错误');
                    var pwEl = document.getElementById('password');
                    pwEl.setAttribute('aria-invalid', 'true');
                    pwEl.value = '';
                    pwEl.focus();
                }
            })
            .catch(function(){
                btn.disabled = false;
                if (spinner) spinner.hidden = true;
                setLoginErr('请求失败，请检查网络');
            });
        }
        // 表单提交：Enter / 按钮点击统一走此处
        document.getElementById('loginForm').addEventListener('submit', function(e){ e.preventDefault(); doLogin(); });
        // 用户名 Enter 聚焦到密码（阻止表单自动提交）
        document.getElementById('username').addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); document.getElementById('password').focus(); } });
    </script>
</body>
</html>
